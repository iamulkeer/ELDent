# Başlatma:  docker-compose up --build   (bu qovluqdan)
services:
  db:
    image: postgres:15-alpine
    container_name: eldent_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-eldent_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-eldent_db}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: 04_Deploy/Dockerfile.backend
    container_name: eldent_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-eldent_db}
      SECRET_KEY: ${SECRET_KEY:-supersecretkeyeldent2026}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@eldent.az}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: 04_Deploy/Dockerfile.web
    container_name: eldent_web
    ports:
      - "3000:80"
    depends_on:
      - backend

  admin:
    build:
      context: ..
      dockerfile: 04_Deploy/Dockerfile.admin
    container_name: eldent_admin
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  pgdata:
